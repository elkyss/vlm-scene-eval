# Run config: mock_oracle
run_id: mock_oracle
loader:
  name: nuscenes
  params:
    dataroot: data/nuscenes
    version: v1.0-mini
    cameras: [CAM_FRONT]
    frames_per_scene: 5      # null = all ~40 keyframes per scene
    scenes: null             # e.g. [scene-0061, scene-1094]
ground_truth:
  name: nuscenes
  params:
    dataroot: data/nuscenes
    version: v1.0-mini
    camera: CAM_FRONT
    min_visibility: 2        # nuScenes level 2 = 40-60% visible
    max_distance_m: 50
vlm:
  name: mock
  params: {mode: oracle}
prompt: v2_structured
writers: [jsonl, csv]
metrics: []                  # empty = all default metrics
output_dir: outputs
cache_dir: .cache/vlm
seed: 0
