# Release gate for scene-description runs (see src/vlm_eval/evaluation/gate.py).
# Floors encode "usable as a scene describer", not "state of the art"; keys are summary keys
# of scene_metrics.json. Only metrics checked against the annotations are gated (the judge-based
# "claims supported" is too noisy to block a release on).
thresholds:
  object_coverage: {min: 0.40}                    # mentions at least 40% of visible object types
  chair_i: {max: 0.10}                            # at most 10% of object mentions invented
  specific_claims_supported_ci_low: {min: 0.0}    # measurably about its own scene
  repetition_loop_rate: {max: 0.20}
regression:                                       # vs the current baseline run
  object_coverage: {max_drop: 0.05}
  human_coverage: {max_drop: 0.05}
  chair_i: {max_rise: 0.05}
