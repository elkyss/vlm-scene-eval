name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no torch: tests use mock VLMs)
        run: pip install -e ".[dev]"
      - name: Lint and types
        run: ruff check src tests && ruff format --check src tests && mypy
      - name: Tests (real-data tests skip without nuScenes)
        run: pytest -q
      - name: Gate demo on a synthetic run
        run: python scripts/ci_gate_demo.py
